version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["python", "${PROJECT_ROOT}/.vibesys/tasks/default/managed_evaluation.py", "--", "uv", "run", "--frozen", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py", "--tokenizer-path", "/model", "--seed", "42"]
timeout_seconds = 1800

[benchmark]
command = ["python", "${PROJECT_ROOT}/.vibesys/tasks/default/managed_evaluation.py", "--", "uv", "run", "--frozen", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/benchmark.py", "--tokenizer-path", "/model", "--seed", "42", "--num-samples", "50", "--warmup", "3", "--max-tokens", "512"]
timeout_seconds = 4500

[benchmark.result]
json_argument = "--output-json"
metric = "median_tok_per_sec"

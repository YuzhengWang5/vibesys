version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/launch.py", "--tokenizer-path", "/model", "--seed", "42"]
timeout_seconds = 1800

[benchmark]
command = ["python", "${PROJECT_ROOT}/.vibesys/tasks/default/managed_evaluation.py", "--", "uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/benchmark.py", "--tokenizer-path", "/model", "--seed", "42", "--num-samples", "64", "--warmup", "3", "--max-tokens", "512", "--request-rate", "5", "--request-timeout", "3600", "--max-dispatch-lag", "1"]
timeout_seconds = 10800

[benchmark.result]
json_argument = "--output-json"
metric = "max_throughput_tok_per_sec"
